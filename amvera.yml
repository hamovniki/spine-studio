meta:
  environment: nodejs
  toolchain:
    name: pnpm
    version: latest
build:
  skip: false
  additionalCommands: pnpm run build
  artifacts:
    '*': /
run:
  persistenceMount: /data
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: pnpm run start
  containerPort: 3000
  singleton: true
  zeroDowntime: false
